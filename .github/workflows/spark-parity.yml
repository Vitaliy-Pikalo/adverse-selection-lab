name: Spark parity

on:
  push:
    paths:
      - "src/asl/**"
      - "spark/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/spark-parity.yml"
  pull_request:
    paths:
      - "src/asl/**"
      - "spark/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/spark-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_VENV: .venv-spark
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install isolated locked environment
        run: |
          python -m pip install uv==0.13.9
          python -m venv "$SPARK_VENV"
          uv pip sync --python "$SPARK_VENV/bin/python" spark/requirements.lock
      - name: Lint
        run: '"$SPARK_VENV/bin/ruff" check spark src tests'
      - name: Sample parity and no-lookahead checks
        run: |
          "$SPARK_VENV/bin/python" -B -m pytest \
            tests/test_spark_ingestion.py \
            tests/test_spark_labels.py \
            tests/test_spark_parity.py \
            -m "not spark_full" -q -s -p no:cacheprovider
